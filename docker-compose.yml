services:
  mentro:
    build:
      context: .
      dockerfile: docker/mentro/Dockerfile
    ports:
      - "37797:37797"
    volumes:
      - mentro-data:/app/data
      - ${MENTRO_SOURCES_DIR:-./ref}:/sources:ro
    environment:
      - MENTRO_BIND=0.0.0.0
      - MENTRO_PORT=37797
      - MENTRO_DATA=/app/data
      - MENTRO_SOURCES=/sources
      # Sidecars run as sibling services: point the worker straight at
      # them instead of docker-managed containers (no docker socket in
      # the app container).
      - MENTRO_OFFICE_URL=http://gotenberg:3000
      - MENTRO_OCR_URL=http://paddle-ocr:8080
      - MENTRO_WHISPER_URL=http://whisper:8000
      - MENTRO_EMBED_URL=http://embed:8000
    depends_on:
      - gotenberg
      - paddle-ocr
      - whisper
      - embed
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.32.0-libreoffice
    # Flag, not env: LibreOffice conversions serialize on a process lock
    # and heavy decks exceed the default 30s api timeout -> 503s (the
    # env var did not reliably override in 8.32).
    command: ["gotenberg", "--api-timeout=600s"]
    restart: unless-stopped

  paddle-ocr:
    build:
      context: docker/ocr
    volumes:
      - paddle-models:/root/.paddlex
    restart: unless-stopped

  whisper:
    build:
      context: docker/whisper
    volumes:
      - whisper-models:/root/.cache
    restart: unless-stopped

  embed:
    build:
      context: docker/embedding
    environment:
      # bge-m3 (default) needs ~3 GB RAM; on memory-tight hosts a smaller
      # multilingual model keeps semantic search alive at some quality cost.
      - EMBED_MODEL=${MENTRO_EMBED_MODEL:-BAAI/bge-m3}
    volumes:
      - embed-models:/root/.cache
    restart: unless-stopped

volumes:
  mentro-data:
  paddle-models:
  whisper-models:
  embed-models:
