name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/ci.yml"
      - "apps/**"
      - "packages/**"
      - "proto/**"
      - "rust/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".prettierrc"
  pull_request:
    paths: *paths

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking walks git history

      # Reads the pnpm version from package.json `packageManager` —
      # don't pass a `version` here, it conflicts and throws ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Buf lint + breaking
        uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          breaking: true
          breaking_against: ".git#branch=main"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protocol (TS types + descriptor)
        run: pnpm gen:proto

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.93.1"
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust fmt + clippy + test + build
        run: |
          cd rust
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
          cargo build --release
