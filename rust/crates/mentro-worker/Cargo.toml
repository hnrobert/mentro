[package]
name = "mentro-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
infer = "0.19"
jwalk = "0.8"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
wait-timeout = "0.2"

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
