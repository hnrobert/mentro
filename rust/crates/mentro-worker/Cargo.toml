[package]
name = "mentro-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
bzip2 = "0.4"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
globset = "0.4"
infer = "0.19"
prost = "0.14"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust = "0.6"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
walkdir = "2"
wait-timeout = "0.2"
xz2 = "0.1"
zip = "2"

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
